<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="section-title">
        <i class="fas fa-blog me-2"></i>Blog & News
      </h1>
    </div>
    <div class="row g-4">
      <div class="col-md-4" *ngFor="let post of posts">
        <div class="product-card">
          <img [src]="post.img" class="img-fluid rounded mb-3" style="height: 200px; object-fit: cover; width: 100%;">
          <h5 class="fw-bold">{{ post.title }}</h5>
          <p class="text-muted small"><i class="fas fa-calendar me-1"></i>{{ post.date }}</p>
          <a href="#" class="btn btn-ktl btn-sm">Read More</a>
        </div>
      </div>
    </div>
  </div>
</section>
