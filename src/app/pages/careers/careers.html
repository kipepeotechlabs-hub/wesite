<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="section-title">
        <i class="fas fa-briefcase me-2"></i>Careers at KTL
      </h1>
      <p class="text-muted">Join our team and build the future of African tech</p>
    </div>
    <div class="row g-4">
      <div class="col-md-6" *ngFor="let job of jobs">
        <div class="product-card">
          <h5 class="fw-bold">{{ job.title }}</h5>
          <p class="mb-1"><i class="fas fa-map-marker-alt text-warning me-2"></i>{{ job.location }}</p>
          <p class="mb-3"><i class="fas fa-clock text-warning me-2"></i>{{ job.type }}</p>
          <a href="/contact" class="btn btn-ktl btn-sm">Apply Now</a>
        </div>
      </div>
    </div>
  </div>
</section>
